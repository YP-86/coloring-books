<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Coloring Book ✨🎨</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ffecd2, #fcb69f, #a1c4fd, #c2e9fb, #ffecd2);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 700px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.8rem;
            color: #4a3f6b;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
            animation: bounceIn 1s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        .header p {
            color: #6b5e8a;
            font-size: 1.1rem;
            margin-top: 8px;
            font-weight: 600;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            border: 3px solid #e0daf0;
            border-radius: 16px;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: #4a3f6b;
        }

        .input-group input::placeholder {
            color: #b0a8c8;
        }

        .input-group input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.2), 0 0 20px rgba(167, 139, 250, 0.15);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .chip {
            padding: 8px 16px;
            background: linear-gradient(135deg, #e0daf0, #f0e6ff);
            border: 2px solid transparent;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #6b5e8a;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Nunito', sans-serif;
        }

        .chip:hover {
            background: linear-gradient(135deg, #a78bfa, #c4b5fd);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.3);
        }

        .chip:active {
            transform: scale(0.95);
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.5px;
            color: white;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-generate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-generate:hover::before {
            left: 100%;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
        }

        .btn-generate:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-generate:disabled {
            background: #b0a8c8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-area {
            display: none;
            animation: fadeInUp 0.6s ease-out;
        }

        .result-area.visible {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #e0daf0;
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            color: #6b5e8a;
            font-weight: 600;
            font-size: 1.1rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .image-container {
            text-align: center;
        }

        .image-container img {
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            animation: imageReveal 0.8s ease-out;
            background: white;
        }

        @keyframes imageReveal {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            border: 3px solid #a78bfa;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #7c3aed;
        }

        .btn-action:hover {
            background: #7c3aed;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .error-msg {
            display: none;
            text-align: center;
            color: #e53e3e;
            font-weight: 600;
            padding: 20px;
            animation: shake 0.5s ease;
        }

        .error-msg.visible {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #8b7fad;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 0.95rem;
            }

            .card {
                padding: 20px;
                border-radius: 18px;
            }

            .input-group input {
                padding: 14px 16px;
                font-size: 1rem;
            }

            .btn-generate {
                padding: 14px;
                font-size: 1.1rem;
            }

            .chips {
                gap: 6px;
            }

            .chip {
                padding: 6px 12px;
                font-size: 0.8rem;
            }

            .action-buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-action {
                text-align: center;
            }
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .card, .header, .footer, .chips, .input-group, .btn-generate, .action-buttons, .loading {
                display: none !important;
            }
            .result-area, .result-area.visible {
                display: block !important;
            }
            .image-container img {
                max-width: 100%;
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Magic Coloring Book 🎨</h1>
            <p>Type anything and get a coloring page! Print it & color away.</p>
        </div>

        <div class="card">
            <div class="input-group">
                <input type="text" id="prompt" placeholder="What should we draw? (e.g., a dragon in a castle)" autofocus>
            </div>

            <div class="chips">
                <button class="chip" onclick="setPrompt('a friendly dragon')">🐉 Friendly Dragon</button>
                <button class="chip" onclick="setPrompt('underwater mermaid castle')">🧜 Mermaid Castle</button>
                <button class="chip" onclick="setPrompt('space cat astronaut')">🐱 Space Cat</button>
                <button class="chip" onclick="setPrompt('enchanted forest with fairies')">🧚 Enchanted Forest</button>
                <button class="chip" onclick="setPrompt('pirate ship adventure')">🏴‍☠️ Pirate Ship</button>
                <button class="chip" onclick="setPrompt('cute dinosaur family')">🦕 Dinosaur Family</button>
                <button class="chip" onclick="setPrompt('magical unicorn garden')">🦄 Unicorn Garden</button>
                <button class="chip" onclick="setPrompt('robot building a sandcastle')">🤖 Robot Sandcastle</button>
            </div>

            <button class="btn-generate" id="generateBtn" onclick="generate()">
                🪄 Generate Coloring Page
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>✨ Creating your coloring page...</p>
        </div>

        <div class="error-msg" id="error">
            Oops! Something went wrong. Please try again.
        </div>

        <div class="result-area" id="result">
            <div class="card">
                <div class="image-container">
                    <img id="coloringImage" alt="Your coloring page">
                </div>
                <div class="action-buttons">
                    <button class="btn-action" onclick="printImage()">🖨️ Print</button>
                    <button class="btn-action" onclick="downloadImage()">💾 Download</button>
                    <button class="btn-action" onclick="generate()">🔄 New Version</button>
                </div>
            </div>
        </div>

        <div class="footer">
            Made with ✨ magic and a sprinkle of AI
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('prompt');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const coloringImage = document.getElementById('coloringImage');

        let currentImageUrl = '';
        let retryCount = 0;
        const MAX_RETRIES = 2;

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generate();
        });

        function setPrompt(text) {
            promptInput.value = text;
            promptInput.focus();
            generate();
        }

        function generate() {
            const userPrompt = promptInput.value.trim();
            if (!userPrompt) {
                promptInput.focus();
                promptInput.style.borderColor = '#e53e3e';
                setTimeout(() => promptInput.style.borderColor = '', 1000);
                return;
            }

            retryCount = 0;
            startGeneration(userPrompt);
        }

        function startGeneration(userPrompt) {
            // Show loading
            generateBtn.disabled = true;
            generateBtn.textContent = retryCount > 0 ? `⏳ Retrying (${retryCount})...` : '⏳ Generating...';
            loading.classList.add('visible');
            result.classList.remove('visible');
            error.classList.remove('visible');

            const suffix = ', black and white line art coloring book page, simple bold outlines, no shading, white background, clean lines for coloring';
            const fullPrompt = encodeURIComponent(userPrompt + suffix);
            const seed = Math.floor(Math.random() * 100000);
            const imageUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?width=1024&height=1024&seed=${seed}&nologo=true`;

            currentImageUrl = imageUrl;

            // Use fetch to get the image as a blob (avoids CORS issues with img tag)
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 120000); // 2 min timeout

            fetch(imageUrl, { signal: controller.signal })
                .then(response => {
                    clearTimeout(timeout);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.blob();
                })
                .then(blob => {
                    if (blob.size === 0) throw new Error('Empty response');
                    const objectUrl = URL.createObjectURL(blob);
                    coloringImage.src = objectUrl;
                    loading.classList.remove('visible');
                    result.classList.add('visible');
                    generateBtn.disabled = false;
                    generateBtn.textContent = '🪄 Generate Coloring Page';
                })
                .catch(err => {
                    clearTimeout(timeout);
                    console.error('Generation error:', err);
                    if (retryCount < MAX_RETRIES) {
                        retryCount++;
                        setTimeout(() => startGeneration(userPrompt), 2000);
                    } else {
                        loading.classList.remove('visible');
                        error.classList.add('visible');
                        generateBtn.disabled = false;
                        generateBtn.textContent = '🪄 Generate Coloring Page';
                    }
                });
        }

        function printImage() {
            window.print();
        }

        function downloadImage() {
            const link = document.createElement('a');
            // If it's a blob URL, download directly
            if (coloringImage.src.startsWith('blob:')) {
                link.href = coloringImage.src;
                link.download = 'coloring-page.jpg';
                link.click();
            } else {
                window.open(currentImageUrl, '_blank');
            }
        }
    </script>
</body>
</html>
